<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" role="img" aria-labelledby="title desc">
  <title id="title">FarhaanOS - developer control panel</title>
  <desc id="desc">A quiet terminal panel with a wide-eyed, abstract terminal mascot and a tiny sweat drop. Profile edition v0.1; curiosity has root access.</desc>
  <rect x="1" y="1" width="838" height="318" rx="16" fill="#0D1117" stroke="#39434A"/>
  <path d="M17 1H823Q839 1 839 17V45H1V17Q1 1 17 1Z" fill="#161B22"/>
  <path d="M1 45H839" stroke="#39434A"/>
  <g font-family="Consolas, 'Liberation Mono', monospace">
    <circle cx="24" cy="23" r="4" fill="#E5CDBC"/><circle cx="40" cy="23" r="4" fill="#A2C2D2"/><circle cx="56" cy="23" r="4" fill="#7DB6B1"/>
    <text x="76" y="28" fill="#A2B7BE" font-size="12">farhaan@github:~</text>
    <text x="814" y="28" text-anchor="end" fill="#A2C2D2" font-size="12">PROFILE / v0.1</text>
    <text x="32" y="88" fill="#7DB6B1" font-size="15">&gt; boot curiosity</text>
    <text x="28" y="160" fill="#F1E8DF" font-size="64" font-weight="700" letter-spacing="-3">Farhaan<tspan fill="#A2C2D2">OS</tspan></text>
    <text x="32" y="198" fill="#A2B7BE" font-size="16">DEVELOPER CONTROL PANEL</text>
    <rect x="32" y="224" width="4" height="18" rx="1" fill="#E5CDBC"/>
    <text x="46" y="238" fill="#E5CDBC" font-size="14">curiosity has root access.</text>
    <path d="M32 266H808" stroke="#39434A"/>
    <text x="32" y="294" fill="#A2B7BE" font-size="12">OPERATOR: FAR-200</text>
    <text x="808" y="294" text-anchor="end" fill="#A2B7BE" font-size="12">PERSONAL SYSTEM / ALWAYS IN DEVELOPMENT</text>
  </g>
  <!-- An original, abstract terminal face: a blank stare and one small drop. -->
  <rect x="582" y="77" width="210" height="166" rx="12" fill="#18232A" stroke="#39434A"/>
  <path d="M583 107H791" stroke="#39434A"/>
  <circle cx="601" cy="92" r="3" fill="#E5CDBC"/><path d="M614 92H642" stroke="#A2B7BE" stroke-width="2" stroke-linecap="round"/>
  <path d="M617 131l-11 11 11 11M757 131l11 11-11 11" fill="none" stroke="#A2C2D2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="662" cy="157" r="7" fill="none" stroke="#E5CDBC" stroke-width="3"/><circle cx="708" cy="157" r="7" fill="none" stroke="#E5CDBC" stroke-width="3"/>
  <path d="M677 183h16" fill="none" stroke="#E5CDBC" stroke-width="3" stroke-linecap="round"/>
  <path d="M737 132c-3 5-5 8-5 11a5 5 0 0 0 10 0c0-3-2-6-5-11Z" fill="#6FAFCE"/>
  <path d="M669 211h30" stroke="#7DB6B1" stroke-width="3" stroke-linecap="round"/>
</svg>
